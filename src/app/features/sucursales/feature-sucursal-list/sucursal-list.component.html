<div class="p-6 w-full space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-6xl font-extrabold">Sucursales</h1>
      <p class="text-muted-foreground">Administra las sucursales del negocio.</p>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex rounded-md border p-0.5">
        <button z-button [zType]="vista() === 'tabla' ? 'secondary' : 'ghost'" zSize="sm" (click)="vista.set('tabla')">
          <ng-icon name="lucideList" class="mr-1.5 size-4" /> Tabla
        </button>
        <button z-button [zType]="vista() === 'mapa' ? 'secondary' : 'ghost'" zSize="sm" (click)="vista.set('mapa')">
          <ng-icon name="lucideMap" class="mr-1.5 size-4" /> Mapa
        </button>
      </div>
      <a z-button zType="default" routerLink="/sucursales/nuevo">
        <ng-icon name="lucidePlus" class="mr-2" /> Nueva Sucursal
      </a>
    </div>
  </div>

  <!-- Resumen -->
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
    <div class="flex flex-col gap-2 rounded-xl border bg-card p-1.5">
      <div class="flex items-center gap-2 px-2.5 pt-1.5 text-sm font-medium">
        <ng-icon name="lucideStore" class="size-4 text-muted-foreground" /> Sucursales
      </div>
      <div class="rounded-lg bg-card-foreground p-4">
        <p class="text-4xl font-extrabold text-accent">{{ totalSucursales() }}</p>
        <p class="mt-1.5 text-sm text-neutral-400">Registradas en el sistema</p>
      </div>
    </div>

    <div class="flex flex-col gap-2 rounded-xl border bg-card p-1.5">
      <div class="flex items-center gap-2 px-2.5 pt-1.5 text-sm font-medium">
        <ng-icon name="lucideCircleCheck" class="size-4 text-muted-foreground" /> Activas
      </div>
      <div class="rounded-lg bg-card-foreground p-4">
        <p class="text-4xl font-extrabold text-accent">{{ totalActivas() }}</p>
        <p class="mt-1.5 text-sm text-neutral-400">Operando ahora</p>
      </div>
    </div>

    <div class="flex flex-col gap-2 rounded-xl border bg-card p-1.5">
      <div class="flex items-center gap-2 px-2.5 pt-1.5 text-sm font-medium">
        <ng-icon name="lucideBan" class="size-4 text-muted-foreground" /> Inactivas
      </div>
      <div class="rounded-lg bg-card-foreground p-4">
        <p class="text-4xl font-extrabold text-accent" [class.text-red-400]="totalInactivas() > 0">{{ totalInactivas() }}</p>
        <p class="mt-1.5 text-sm text-neutral-400">Pausadas</p>
      </div>
    </div>
  </div>

  @if (vista() === 'tabla') {
    <app-sucursal-filtros
      [q]="q()"
      [activo]="activo()"
      (qChange)="updateSearch($event)"
      (activoChange)="updateActivo($event)"
    ></app-sucursal-filtros>

    <app-sucursal-table
      [sucursales]="sucursales()"
      [loading]="loading()"
      [sort]="sort()"
      [totalItems]="totalItems()"
      [totalPages]="totalPages()"
      [page]="page()"
      [pageSize]="pageSize()"
      (sortChange)="toggleSort($event)"
      (pageChange)="page.set($event)"
      (pageSizeChange)="updatePageSize($event)"
      (editar)="openEditSheet($event)"
      (desactivar)="desactivar($event)"
      (activar)="activar($event)"
    ></app-sucursal-table>
  } @else {
    <app-sucursal-mapa-lista [sucursales]="todas()" />
  }
</div>
