<div class="p-6 w-full space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">Sucursales</h1>
      <p class="text-muted-foreground">Administra las sucursales del negocio.</p>
    </div>
    <div class="flex items-center gap-2">
      <button z-button zType="default" (click)="openCreateSheet()">
        <ng-icon name="lucidePlus" class="mr-2" /> Nueva Sucursal
      </button>
    </div>
  </div>

  <!-- Resumen -->
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
    <div z-card class="gap-0 py-4">
      <z-card-content class="flex items-start justify-between gap-3">
        <div class="space-y-1">
          <p class="text-xs font-medium uppercase tracking-wide text-muted-foreground">Total de sucursales</p>
          <p class="text-2xl font-semibold tabular-nums">{{ totalSucursales() }}</p>
        </div>
        <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-primary/10 text-primary">
          <ng-icon name="lucideStore" class="size-4" />
        </span>
      </z-card-content>
    </div>

    <div z-card class="gap-0 py-4">
      <z-card-content class="flex items-start justify-between gap-3">
        <div class="space-y-1">
          <p class="text-xs font-medium uppercase tracking-wide text-muted-foreground">Activas</p>
          <p class="text-2xl font-semibold tabular-nums text-green-600 dark:text-green-400">{{ totalActivas() }}</p>
        </div>
        <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-muted text-muted-foreground">
          <ng-icon name="lucideCircleCheck" class="size-4" />
        </span>
      </z-card-content>
    </div>

    <div z-card class="gap-0 py-4">
      <z-card-content class="flex items-start justify-between gap-3">
        <div class="space-y-1">
          <p class="text-xs font-medium uppercase tracking-wide text-muted-foreground">Inactivas</p>
          <p class="text-2xl font-semibold tabular-nums" [class.text-destructive]="totalInactivas() > 0">{{ totalInactivas() }}</p>
        </div>
        <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-muted text-muted-foreground">
          <ng-icon name="lucideBan" class="size-4" />
        </span>
      </z-card-content>
    </div>
  </div>

  <app-sucursal-filtros
    [q]="q()"
    [activo]="activo()"
    (qChange)="updateSearch($event)"
    (activoChange)="updateActivo($event)"
  ></app-sucursal-filtros>

  <app-sucursal-table
    [sucursales]="sucursales()"
    [loading]="loading()"
    [sort]="sort()"
    [totalItems]="totalItems()"
    [totalPages]="totalPages()"
    [page]="page()"
    [pageSize]="pageSize()"
    (sortChange)="toggleSort($event)"
    (pageChange)="page.set($event)"
    (pageSizeChange)="updatePageSize($event)"
    (editar)="openEditSheet($event)"
    (desactivar)="desactivar($event)"
    (activar)="activar($event)"
  ></app-sucursal-table>
</div>
