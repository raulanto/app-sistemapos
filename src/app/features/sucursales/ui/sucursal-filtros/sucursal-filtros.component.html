<div class="flex flex-wrap items-center gap-3">
  <!-- Búsqueda -->
  <z-input-group class="w-full sm:w-72">
    <z-input-group-addon>
      <ng-icon name="lucideSearch" />
    </z-input-group-addon>
    <input
      z-input
      type="text"
      placeholder="Buscar por nombre, dirección o teléfono..."
      [ngModel]="q()"
      (ngModelChange)="qChange.emit($event)"
    />
    @if (q()) {
      <z-input-group-addon zAlign="inline-end">
        <button z-input-group-button zSize="icon-xs" (click)="limpiarBusqueda()" aria-label="Limpiar búsqueda">
          <ng-icon name="lucideX" />
        </button>
      </z-input-group-addon>
    }
  </z-input-group>

  <!-- Estado (segmentado) -->
  <z-toggle-group
    zMode="single"
    zType="outline"
    [zItems]="estadoItems"
    [ngModel]="estadoValue()"
    (ngModelChange)="onEstadoChange($event)"
    aria-label="Filtrar por estado"
  />

  @if (hayFiltrosActivos()) {
    <button z-button zType="ghost" zSize="sm" (click)="limpiarFiltros()">
      <ng-icon name="lucideFilterX" class="mr-1.5 size-4" />
      Limpiar filtros
    </button>
  }
</div>
