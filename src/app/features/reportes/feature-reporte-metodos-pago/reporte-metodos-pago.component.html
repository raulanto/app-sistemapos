<div class="space-y-4">
  <app-reporte-filtros [cargando]="cargando()" (recargar)="cargar()" ayuda="Fecha y sucursal aplican a Ventas, Métodos de pago, Por vendedor, Productos más vendidos y Mermas.">
    <app-reporte-exportar path="ventas-por-metodo-pago" [query]="filtros.rango()" [disabled]="!reporte()" />
  </app-reporte-filtros>

  @if (cargando()) {
    <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
      @for (i of [1, 2, 3]; track i) {
        <z-skeleton class="h-24" />
      }
    </div>
    <z-skeleton class="h-64 w-full" />
  } @else if (reporte(); as m) {
    <app-reporte-kpi-grid [kpis]="kpis()" />

    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
      @if (metodoPagoData().length) {
        <div class="rounded-xl border bg-card p-4">
          <z-chart class="block w-full" zType="pie" [zData]="metodoPagoData()" [zSeries]="metodoPagoSeries" zXAxisKey="metodo_pago">
            <z-chart-tooltip />
            <z-chart-legend />
          </z-chart>
        </div>
      } @else {
        <z-empty zIcon="lucideWallet" zTitle="Sin ventas en el rango" class="py-10" />
      }

      <div class="self-start overflow-hidden rounded-xl border">
        <table z-table>
          <thead z-table-header class="bg-muted/50">
            <tr z-table-row>
              <th z-table-head>Método</th>
              <th z-table-head class="text-right">Total</th>
            </tr>
          </thead>
          <tbody z-table-body>
            @for (d of m.detalle; track d.metodo_pago) {
              <tr z-table-row>
                <td z-table-cell class="capitalize">{{ etiqueta(d.metodo_pago) }}</td>
                <td z-table-cell class="text-right tabular-nums">{{ d.total | currency }}</td>
              </tr>
            }
          </tbody>
          <tfoot z-table-footer>
            <tr z-table-row>
              <td z-table-cell class="font-semibold">Total</td>
              <td z-table-cell class="text-right font-semibold tabular-nums">{{ m.total_general | currency }}</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  }
</div>
