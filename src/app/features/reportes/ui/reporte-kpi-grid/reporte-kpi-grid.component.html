<div class="*:data-[slot=card]:from-primary/5 *:data-[slot=card]:to-card dark:*:data-[slot=card]:bg-card grid grid-cols-1 gap-4 *:data-[slot=card]:bg-linear-to-t *:data-[slot=card]:shadow-xs sm:grid-cols-2 lg:grid-cols-4">
  @for (k of kpis(); track k.label) {
    <z-card class="gap-3 transition-shadow duration-200 hover:shadow-md" [class.sm:col-span-2]="k.destacado">
      <z-card-header>
        <z-card-description [zDescription]="k.label" class="text-xs font-medium uppercase tracking-wide" />
        <z-card-title [zTitle]="k.value" class="mt-1 font-semibold tabular-nums" [class]="valorClase(k.tono) + (k.destacado ? ' text-3xl' : ' text-2xl lg:text-3xl')" />
        @if (k.icon) {
          <z-card-action>
            <ng-icon [name]="k.icon" class="size-4 text-muted-foreground" />
          </z-card-action>
        }
      </z-card-header>
      @if (k.caption) {
        <z-card-footer class="flex-col items-start gap-1 border-t border-border/60 bg-transparent pt-3 text-sm">
          <div class="text-xs text-muted-foreground">{{ k.caption }}</div>
        </z-card-footer>
      }
    </z-card>
  }
</div>
