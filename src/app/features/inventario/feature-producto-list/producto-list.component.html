<div class="p-6 w-full space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">Productos</h1>
      <p class="text-muted-foreground">Gestiona el catálogo de productos y precios.</p>
    </div>
    @if (canCrear()) {
      <div class="flex items-center gap-2">
        <a z-button zType="default" routerLink="/inventario/productos/nuevo">
          <ng-icon name="lucidePlus" class="mr-2" /> Nuevo Producto
        </a>
      </div>
    }
  </div>

  <app-producto-filtros
    [q]="q()"
    [categorias]="categorias()"
    [categoriaId]="categoriaId()"
    [activo]="activo()"
    [todasLasSucursales]="todasLasSucursales()"
    (qChange)="updateSearch($event)"
    (categoriaIdChange)="updateCategoria($event)"
    (activoChange)="updateActivo($event)"
    (todasLasSucursalesChange)="updateTodasLasSucursales($event)"
  ></app-producto-filtros>

    <app-producto-table
      [productos]="productos()"
      [loading]="loading()"
      [selectedIds]="selectedIds()"
      [allSelected]="allSelected()"
      [sort]="sort()"
      [canEditar]="canEditar()"
      [canCrearMovimiento]="canCrear()"
      [totalItems]="totalItems()"
      [totalPages]="totalPages()"
      [page]="page()"
      [pageSize]="pageSize()"
      (sortChange)="toggleSort($event)"
      (pageChange)="page.set($event)"
      (pageSizeChange)="updatePageSize($event)"
      (toggleSelection)="toggleSelection($event.id, $event.checked)"
      (toggleAll)="toggleAll($event)"
      (desactivar)="desactivar($event)"
      (activar)="activar($event)"
      (editar)="openEditSheet($event)"
      (crearMovimiento)="openMovimientoSheet($event)"
    ></app-producto-table>
</div>
