<div class="p-6 w-full space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">Productos</h1>
      <p class="text-muted-foreground">Gestiona el catálogo de productos y precios.</p>
    </div>
    @if (canCrear()) {
      <div class="flex items-center gap-2">
        <a z-button zType="default" routerLink="/inventario/productos/nuevo">
          <ng-icon name="lucidePlus" class="mr-2" /> Nuevo Producto
        </a>
      </div>
    }
  </div>

  <!-- KPIs -->
  <div class="*:data-[slot=card]:from-primary/5 *:data-[slot=card]:to-card dark:*:data-[slot=card]:bg-card grid grid-cols-1 gap-4 *:data-[slot=card]:bg-linear-to-t *:data-[slot=card]:shadow-xs sm:grid-cols-2 xl:grid-cols-4">
    @for (card of cards(); track card.description) {
      <z-card class="gap-3 transition-shadow duration-200 hover:shadow-md">
        <z-card-header>
          <z-card-description [zDescription]="card.description" class="text-xs font-medium uppercase tracking-wide" />
          <z-card-title [zTitle]="card.value" class="mt-1 text-2xl font-semibold tabular-nums lg:text-3xl" />
          <z-card-action>
            <z-badge zType="outline" class="gap-1 font-medium">
              <ng-icon [name]="trendIcon(card.trend)" class="size-3.5" />
              {{ card.badge }}
            </z-badge>
          </z-card-action>
        </z-card-header>

        <z-card-footer class="flex-col items-start gap-1 border-t border-border/60 bg-transparent pt-3 text-sm">
          <div class="line-clamp-1 flex items-center gap-1.5 font-medium">
            {{ card.headline }}
            <ng-icon [name]="trendIcon(card.trend)" class="size-4 text-muted-foreground" />
          </div>
          <div class="text-xs text-muted-foreground">{{ card.caption }}</div>
        </z-card-footer>
      </z-card>
    }
  </div>

  <app-producto-filtros
    [q]="q()"
    [categorias]="categorias()"
    [categoriaId]="categoriaId()"
    [activo]="activo()"
    [todasLasSucursales]="todasLasSucursales()"
    (qChange)="updateSearch($event)"
    (categoriaIdChange)="updateCategoria($event)"
    (activoChange)="updateActivo($event)"
    (todasLasSucursalesChange)="updateTodasLasSucursales($event)"
  ></app-producto-filtros>

    <app-producto-table
      [productos]="productos()"
      [loading]="loading()"
      [selectedIds]="selectedIds()"
      [allSelected]="allSelected()"
      [sort]="sort()"
      [canEditar]="canEditar()"
      [canCrearMovimiento]="canCrear()"
      [totalItems]="totalItems()"
      [totalPages]="totalPages()"
      [page]="page()"
      [pageSize]="pageSize()"
      (sortChange)="toggleSort($event)"
      (pageChange)="page.set($event)"
      (pageSizeChange)="updatePageSize($event)"
      (toggleSelection)="toggleSelection($event.id, $event.checked)"
      (toggleAll)="toggleAll($event)"
      (desactivar)="desactivar($event)"
      (activar)="activar($event)"
      (editar)="openEditSheet($event)"
      (crearMovimiento)="openMovimientoSheet($event)"
    ></app-producto-table>
</div>
