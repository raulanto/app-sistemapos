<form [formGroup]="form" class="grid min-h-0 flex-1 auto-rows-min gap-6 px-4 pb-4 overflow-y-auto">
  <div z-field>
    <label z-field-label for="nombre">Nombre *</label>
    <input z-input id="nombre" type="text" formControlName="nombre" maxlength="100" placeholder="Ej. Bebidas" />
    @if (form.controls.nombre.invalid && form.controls.nombre.touched) {
      <p class="text-[0.8rem] font-medium text-destructive">El nombre es obligatorio.</p>
    }
  </div>

  <div z-field>
    <label z-field-label>Categoría padre</label>
    <z-select formControlName="categoria_padre_id" placeholder="Ninguna (categoría raíz)">
      <z-select-item zValue="">Ninguna (categoría raíz)</z-select-item>
      @for (cat of categorias(); track cat.id) {
        <z-select-item [zValue]="cat.id">{{ cat.nombre }}</z-select-item>
      }
    </z-select>
    <p class="text-[0.8rem] text-muted-foreground">Déjala en "Ninguna" para una categoría de primer nivel.</p>
  </div>
</form>
