<div class="p-6 w-full space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div class="space-y-1">
      <a routerLink="/usuarios" class="inline-flex items-center gap-1.5 text-sm text-muted-foreground hover:text-foreground">
        <ng-icon name="lucideArrowLeft" class="size-4" /> Usuarios
      </a>
      <h1 class="text-2xl font-bold tracking-tight">Roles y permisos</h1>
      <p class="text-muted-foreground">Crea roles y define qué puede hacer cada uno.</p>
    </div>
    @if (canGestionar()) {
      <button z-button zType="default" (click)="openCreateSheet()">
        <ng-icon name="lucidePlus" class="mr-2" /> Nuevo Rol
      </button>
    }
  </div>

  <app-rol-table
    [roles]="roles()"
    [loading]="loading()"
    [sort]="sort()"
    [canGestionar]="canGestionar()"
    [totalItems]="totalItems()"
    [totalPages]="totalPages()"
    [page]="page()"
    [pageSize]="pageSize()"
    (sortChange)="toggleSort($event)"
    (pageChange)="page.set($event)"
    (pageSizeChange)="updatePageSize($event)"
    (editar)="openEditSheet($event)"
    (permisos)="openPermisosSheet($event)"
    (eliminar)="eliminar($event)"
  ></app-rol-table>
</div>
