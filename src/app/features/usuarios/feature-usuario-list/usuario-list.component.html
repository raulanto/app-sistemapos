<div class="w-full space-y-6 p-4 sm:p-6 lg:p-8">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-border pb-5">
    <div>
      <h1 class="text-2xl font-bold tracking-tight sm:text-3xl text-foreground font-display">Usuarios</h1>
      <p class="text-sm text-muted-foreground mt-1">Administra las cuentas del sistema y sus roles.</p>
    </div>
    <div class="flex items-center gap-2">
      <a z-button zType="outline" routerLink="/usuarios/roles">
        <ng-icon name="lucideShieldCheck" class="mr-2" /> Roles y permisos
      </a>
      @if (canCrear()) {
        <button z-button zType="default" (click)="openCreateSheet()">
          <ng-icon name="lucidePlus" class="mr-2" /> Nuevo Usuario
        </button>
      }
    </div>
  </div>

  <!-- Resumen -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
    <div class="flex flex-col justify-between rounded-xl border border-border bg-card p-4 shadow-xs">
      <div class="flex items-center justify-between">
        <span class="text-xs font-medium uppercase tracking-wider text-muted-foreground">Total Usuarios</span>
        <div class="flex size-7 items-center justify-center rounded-md bg-primary/10 text-primary">
          <ng-icon name="lucideUsers" class="size-4" />
        </div>
      </div>
      <div class="mt-3">
        <p class="text-2xl font-bold tracking-tight text-foreground">{{ totalUsuarios() }}</p>
        <p class="text-xs text-muted-foreground mt-1">Registrados en el sistema</p>
      </div>
    </div>

    <div class="flex flex-col justify-between rounded-xl border border-border bg-card p-4 shadow-xs">
      <div class="flex items-center justify-between">
        <span class="text-xs font-medium uppercase tracking-wider text-muted-foreground">Usuarios Activos</span>
        <div class="flex size-7 items-center justify-center rounded-md bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">
          <ng-icon name="lucideCircleCheck" class="size-4" />
        </div>
      </div>
      <div class="mt-3">
        <p class="text-2xl font-bold tracking-tight text-emerald-600 dark:text-emerald-400">{{ totalActivos() }}</p>
        <p class="text-xs text-muted-foreground mt-1">Con acceso permitido</p>
      </div>
    </div>

    <div class="flex flex-col justify-between rounded-xl border border-border bg-card p-4 shadow-xs">
      <div class="flex items-center justify-between">
        <span class="text-xs font-medium uppercase tracking-wider text-muted-foreground">Usuarios Inactivos</span>
        <div class="flex size-7 items-center justify-center rounded-md bg-amber-500/10 text-amber-600 dark:text-amber-400">
          <ng-icon name="lucideBan" class="size-4" />
        </div>
      </div>
      <div class="mt-3">
        <p class="text-2xl font-bold tracking-tight" [class.text-red-500]="totalInactivos() > 0">{{ totalInactivos() }}</p>
        <p class="text-xs text-muted-foreground mt-1">Acceso restringido</p>
      </div>
    </div>
  </div>

  <app-usuario-table
    [usuarios]="usuarios()"
    [loading]="loading()"
    [sort]="sort()"
    [canEditar]="canEditar()"
    [canDesactivar]="canDesactivar()"
    [totalItems]="totalItems()"
    [totalPages]="totalPages()"
    [page]="page()"
    [pageSize]="pageSize()"
    (sortChange)="toggleSort($event)"
    (pageChange)="page.set($event)"
    (pageSizeChange)="updatePageSize($event)"
    (editar)="openEditSheet($event)"
    (cambiarRol)="openRolSheet($event)"
    (desactivar)="desactivar($event)"
    (activar)="activar($event)"
  ></app-usuario-table>
</div>
