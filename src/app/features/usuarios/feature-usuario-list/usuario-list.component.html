<div class="p-6 w-full space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-6xl font-extrabold">Usuarios</h1>
      <p class="text-muted-foreground">Administra las cuentas del sistema y sus roles.</p>
    </div>
    <div class="flex items-center gap-2">
      <a z-button zType="outline" routerLink="/usuarios/roles">
        <ng-icon name="lucideShieldCheck" class="mr-2" /> Roles y permisos
      </a>
      @if (canCrear()) {
        <button z-button zType="default" (click)="openCreateSheet()">
          <ng-icon name="lucidePlus" class="mr-2" /> Nuevo Usuario
        </button>
      }
    </div>
  </div>

  <!-- Resumen -->
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
    <div class="flex flex-col gap-2 rounded-xl border bg-card p-1.5">
      <div class="flex items-center gap-2 px-2.5 pt-1.5 text-sm font-medium">
        <ng-icon name="lucideUsers" class="size-4 text-muted-foreground" /> Usuarios
      </div>
      <div class="rounded-lg bg-card-foreground p-4">
        <p class="text-4xl font-extrabold text-accent">{{ totalUsuarios() }}</p>
        <p class="mt-1.5 text-sm text-neutral-400">Registrados en el sistema</p>
      </div>
    </div>

    <div class="flex flex-col gap-2 rounded-xl border bg-card p-1.5">
      <div class="flex items-center gap-2 px-2.5 pt-1.5 text-sm font-medium">
        <ng-icon name="lucideCircleCheck" class="size-4 text-muted-foreground" /> Activos
      </div>
      <div class="rounded-lg bg-card-foreground p-4">
        <p class="text-4xl font-extrabold text-accent">{{ totalActivos() }}</p>
        <p class="mt-1.5 text-sm text-neutral-400">Con acceso permitido</p>
      </div>
    </div>

    <div class="flex flex-col gap-2 rounded-xl border bg-card p-1.5">
      <div class="flex items-center gap-2 px-2.5 pt-1.5 text-sm font-medium">
        <ng-icon name="lucideBan" class="size-4 text-muted-foreground" /> Inactivos
      </div>
      <div class="rounded-lg bg-card-foreground p-4">
        <p class="text-4xl font-extrabold text-accent" [class.text-red-400]="totalInactivos() > 0">{{ totalInactivos() }}</p>
        <p class="mt-1.5 text-sm text-neutral-400">Acceso restringido</p>
      </div>
    </div>
  </div>

  <app-usuario-table
    [usuarios]="usuarios()"
    [loading]="loading()"
    [sort]="sort()"
    [canEditar]="canEditar()"
    [canDesactivar]="canDesactivar()"
    [totalItems]="totalItems()"
    [totalPages]="totalPages()"
    [page]="page()"
    [pageSize]="pageSize()"
    (sortChange)="toggleSort($event)"
    (pageChange)="page.set($event)"
    (pageSizeChange)="updatePageSize($event)"
    (editar)="openEditSheet($event)"
    (cambiarRol)="openRolSheet($event)"
    (desactivar)="desactivar($event)"
    (activar)="activar($event)"
  ></app-usuario-table>
</div>
