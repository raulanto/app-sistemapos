<div class="p-6 w-full space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">Usuarios</h1>
      <p class="text-muted-foreground">Administra las cuentas del sistema y sus roles.</p>
    </div>
    <div class="flex items-center gap-2">
      <a z-button zType="outline" routerLink="/usuarios/roles">
        <ng-icon name="lucideShieldCheck" class="mr-2" /> Roles y permisos
      </a>
      @if (canCrear()) {
        <button z-button zType="default" (click)="openCreateSheet()">
          <ng-icon name="lucidePlus" class="mr-2" /> Nuevo Usuario
        </button>
      }
    </div>
  </div>

  <!-- Resumen -->
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
    <div z-card class="gap-0 py-4">
      <z-card-content class="flex items-start justify-between gap-3">
        <div class="space-y-1">
          <p class="text-xs font-medium uppercase tracking-wide text-muted-foreground">Total de usuarios</p>
          <p class="text-2xl font-semibold tabular-nums">{{ totalUsuarios() }}</p>
        </div>
        <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-primary/10 text-primary">
          <ng-icon name="lucideUsers" class="size-4" />
        </span>
      </z-card-content>
    </div>

    <div z-card class="gap-0 py-4">
      <z-card-content class="flex items-start justify-between gap-3">
        <div class="space-y-1">
          <p class="text-xs font-medium uppercase tracking-wide text-muted-foreground">Activos</p>
          <p class="text-2xl font-semibold tabular-nums text-green-600 dark:text-green-400">{{ totalActivos() }}</p>
        </div>
        <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-muted text-muted-foreground">
          <ng-icon name="lucideCircleCheck" class="size-4" />
        </span>
      </z-card-content>
    </div>

    <div z-card class="gap-0 py-4">
      <z-card-content class="flex items-start justify-between gap-3">
        <div class="space-y-1">
          <p class="text-xs font-medium uppercase tracking-wide text-muted-foreground">Inactivos</p>
          <p class="text-2xl font-semibold tabular-nums" [class.text-destructive]="totalInactivos() > 0">{{ totalInactivos() }}</p>
        </div>
        <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-muted text-muted-foreground">
          <ng-icon name="lucideBan" class="size-4" />
        </span>
      </z-card-content>
    </div>
  </div>

  <app-usuario-table
    [usuarios]="usuarios()"
    [loading]="loading()"
    [sort]="sort()"
    [canEditar]="canEditar()"
    [canDesactivar]="canDesactivar()"
    [totalItems]="totalItems()"
    [totalPages]="totalPages()"
    [page]="page()"
    [pageSize]="pageSize()"
    (sortChange)="toggleSort($event)"
    (pageChange)="page.set($event)"
    (pageSizeChange)="updatePageSize($event)"
    (editar)="openEditSheet($event)"
    (cambiarRol)="openRolSheet($event)"
    (desactivar)="desactivar($event)"
    (activar)="activar($event)"
  ></app-usuario-table>
</div>
