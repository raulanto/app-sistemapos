<form class="grid min-h-0 flex-1 auto-rows-min gap-6 px-4 pb-4 overflow-y-auto">
  <p class="text-sm text-muted-foreground">
    Rol de <span class="font-medium text-foreground">{{ sheetData?.nombre }}</span>.
    El cambio aplica de inmediato a sus permisos.
  </p>

  <div class="grid grid-cols-1 gap-4">
    @let rolField = rolForm.rol_id();
    @let rolInvalid = rolField.invalid() && rolField.touched();
    <div z-field [attr.data-invalid]="rolInvalid || null">
      <label z-field-label>Rol *</label>
      <z-select [formField]="rolForm.rol_id" placeholder="Selecciona un rol" [zInvalid]="rolInvalid">
        @for (rol of roles(); track rol.id) {
          <z-select-item [zValue]="rol.id">{{ rol.nombre }}</z-select-item>
        }
      </z-select>
      @if (rolInvalid) {
        <z-field-error [zErrors]="rolField.errors()" />
      }
    </div>
  </div>
</form>
