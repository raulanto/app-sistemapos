<form [formGroup]="form" class="grid min-h-0 flex-1 auto-rows-min gap-6 px-4 pb-4 overflow-y-auto" (ngSubmit)="save()">
  <div z-field>
    <label z-field-label>Resultado *</label>
    <z-select formControlName="resultado">
      @for (r of resultados; track r.value) { <z-select-item [zValue]="r.value">{{ r.label }}</z-select-item> }
    </z-select>
  </div>

  @if (esAceptada()) {
    <div z-field [attr.data-invalid]="!form.get('tipo_resolucion')!.value || null">
      <label z-field-label>Tipo de resolución *</label>
      <z-select formControlName="tipo_resolucion" placeholder="Elige cómo se resuelve">
        @for (t of tiposResolucion; track t.value) { <z-select-item [zValue]="t.value">{{ t.label }}</z-select-item> }
      </z-select>
    </div>
  }
</form>
